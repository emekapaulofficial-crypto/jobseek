<script src="app.js"></script><script>
(function(){const $=id=>document.getElementById(id);
$('makeEmail')?.addEventListener('click',()=>{const n=$('emailName').value.trim()||'Candidate Name',r=$('emailRole').value.trim()||'the advertised position',c=$('emailCompany').value.trim()||'Hiring Manager',x=$('emailNote').value.trim();$('emailOutput').textContent='Subject: Application for '+r+' — '+n+'\n\nDear Hiring Manager,\n\nI am writing to apply for the '+r+' position at '+c+'. Please find my CV'+(x?' and the requested supporting information':'')+' attached for your consideration. '+(x?x+' ':'')+'I have reviewed the vacancy requirements and the information provided in my application is accurate and supported by my experience.\n\nThank you for your time and consideration. I would welcome the opportunity to discuss my application.\n\nKind regards,\n'+n;});
$('copyEmail')?.addEventListener('click',()=>{const t=$('emailOutput').textContent;navigator.clipboard?.writeText(t).then(()=>alert('Application email copied.')).catch(()=>alert('Select and copy the email manually.'))});
const key='jobseek_application_tracker',load=()=>JSON.parse(localStorage.getItem(key)||'[]'),save=a=>localStorage.setItem(key,JSON.stringify(a)),render=()=>{const a=load();$('trackerList').innerHTML=a.length?a.map((x,i)=>'<div class="notice" style="margin:8px 0"><strong>'+x.role+'</strong> · '+x.company+'<br><small>Applied: '+(x.date||'Not set')+' · Status: '+x.status+(x.follow?' · Follow-up: '+x.follow:'')+(x.notes?' · '+x.notes:'')+'</small><br><button class="outline" data-del="'+i+'" type="button">Remove</button></div>').join(''):'<p class="micro">No applications tracked yet.</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=load();a.splice(Number(b.dataset.del),1);save(a);render()})};
$('addTrack')?.addEventListener('click',()=>{const a=load();a.unshift({company:$('trackCompany').value.trim()||'Employer',role:$('trackRole').value.trim()||'Role',date:$('trackDate').value,status:$('trackStatus').value,follow:$('trackFollow').value,notes:$('trackNotes').value.trim()});save(a);render();['trackCompany','trackRole','trackDate','trackFollow','trackNotes'].forEach(id=>$(id).value='')});render()})();
</script></body></html>
