<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Document Review</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><p class="eyebrow">JOBSEEK ADMIN</p><h1>Document verification</h1><p class="lead">Review candidate documents before they are used in recruitment processing. Verification here means an agent reviewed the uploaded file; it is not a government authenticity determination.</p><div id="list">Loading documents…</div><p><a href="admin-dashboard.html">← Admin dashboard</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>let client;const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){if(!JobSeekSupabase.configured){$('list').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const u=await client.auth.getUser();if(!u.data.user){location.href='auth.html';return}const me=await client.from('jobseek_accounts').select('role').eq('id',u.data.user.id).single();if(me.error||!['admin','agent'].includes(me.data.role)){$('list').textContent='Access denied.';return}load()}async function load(){const r=await client.from('jobseek_documents').select('id,candidate_id,document_type,file_name,mime_type,file_size,verification_status,review_notes,created_at,candidate_profiles(full_name)').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}if(!r.data.length){$('list').textContent='No candidate documents yet.';return}$('list').innerHTML=r.data.map(d=>`<article class="job" style="padding:20px;margin-bottom:14px"><h2>${esc(d.candidate_profiles?.full_name||'Candidate')}</h2><p><strong>${esc(d.document_type)}</strong> — ${esc(d.file_name)}<br>${Math.round((d.file_size||0)/1024)} KB · ${esc(d.verification_status||'pending')}</p><p><a target="_blank" rel="noopener" href="#" data-view="${d.id}">Open secure document</a></p><textarea data-note="${d.id}" rows="2" placeholder="Review note">${esc(d.review_notes||'')}</textarea><div style="margin-top:8px"><select data-status="${d.id}"><option value="pending" ${d.verification_status==='pending'?'selected':''}>Pending</option><option value="verified" ${d.verification_status==='verified'?'selected':''}>Verified</option><option value="rejected" ${d.verification_status==='rejected'?'selected':''}>Rejected</option></select><button class="btn" data-save="${d.id}">Save review</button><span class="micro" data-msg="${d.id}"></span></div></article>`).join('')}
document.addEventListener('click',async e=>{const v=e.target.closest('[data-view]');if(v){e.preventDefault();const r=await client.from('jobseek_documents').select('storage_path').eq('id',v.dataset.view).single();if(r.error){alert(r.error.message);return}const s=await client.storage.from('jobseek-documents').createSignedUrl(r.data.storage_path,300);if(s.error){alert(s.error.message);return}window.open(s.data.signedUrl,'_blank','noopener')}const b=e.target.closest('[data-save]');if(b){const id=b.dataset.save;const status=document.querySelector(`[data-status="${id}"]`).value,note=document.querySelector(`[data-note="${id}"]`).value;const r=await client.from('jobseek_documents').update({verification_status:status,review_notes:note}).eq('id',id);const m=document.querySelector(`[data-msg="${id}"]`);m.textContent=r.error?r.error.message:'Saved ✓'}});init();</script></body></html>
