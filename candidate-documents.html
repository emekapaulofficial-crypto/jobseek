<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Documents</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container" style="max-width:760px"><p class="eyebrow">JOBSEEK CANDIDATE PORTAL</p><h1>My recruitment documents</h1><p class="lead">Upload your CV, passport bio page and certificates securely. These documents are stored in a private JobSeek storage area.</p><div class="job" style="padding:24px"><form id="docForm"><label>Document type<select id="type" required style="width:100%;padding:12px;margin:6px 0 14px"><option value="cv">CV</option><option value="passport">Passport bio page</option><option value="certificate">Certificate</option><option value="qualification">Qualification</option><option value="work_permit">Work permit</option><option value="other">Other</option></select></label><label>Choose file<input id="file" type="file" required accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="width:100%;padding:12px;margin:6px 0 14px"></label><button class="btn" type="submit">Upload securely</button></form><p id="status" class="micro" role="status"></p></div><div class="job" style="margin-top:20px;padding:24px"><h2>Uploaded documents</h2><div id="list">Loading…</div></div><p><a href="candidate-dashboard.html">← Candidate dashboard</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
let client,user;const $=x=>document.getElementById(x);const allowed=['application/pdf','image/jpeg','image/png','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
async function init(){if(!JobSeekSupabase.configured){$('status').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const r=await client.auth.getUser();if(!r.data.user){location.href='auth.html';return}user=r.data.user;load()}
async function load(){const r=await client.from('jobseek_documents').select('id,document_type,file_name,verification_status,created_at,storage_path').eq('candidate_id',user.id);if(r.error){$('list').textContent=r.error.message;return}if(!r.data.length){$('list').textContent='No documents uploaded yet.';return}$('list').innerHTML=r.data.map(d=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><strong>${d.document_type}</strong> — ${d.file_name}<br>Status: ${d.verification_status}</div>`).join('')}
$('docForm').onsubmit=async e=>{e.preventDefault();const f=$('file').files[0];if(!f)return;if(!allowed.includes(f.type)){ $('status').textContent='File type not allowed.';return }if(f.size>10*1024*1024){$('status').textContent='Maximum file size is 10 MB.';return} $('status').textContent='Uploading…';const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${user.id}/${$('type').value}/${crypto.randomUUID()}-${safe}`;const up=await client.storage.from('jobseek-documents').upload(path,f,{contentType:f.type,upsert:false});if(up.error){$('status').textContent=up.error.message;return}const row=await client.from('jobseek_documents').insert({candidate_id:user.id,document_type:$('type').value,file_name:f.name,storage_path:path,mime_type:f.type,file_size:f.size});if(row.error){await client.storage.from('jobseek-documents').remove([path]);$('status').textContent=row.error.message;return}$('status').textContent='Uploaded successfully ✓';$('file').value='';load()};init();</script></body></html>
