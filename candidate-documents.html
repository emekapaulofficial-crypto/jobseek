<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Documents</title><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs" type="module"></script><script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">J</span><b>Job<span>Seek</span></b></a><button id="menu" aria-label="Open navigation" aria-expanded="false">☰</button><nav id="nav"><a href="jobs.html">Find Jobs</a><a href="candidate-dashboard.html">Dashboard</a><a href="ats-cv-builder.html">CV Builder</a><a href="application-assistant.html">Application Assistant</a><a href="job-alerts.html">Job Alerts</a></nav></div></header><main class="section"><div class="container" style="max-width:760px"><p class="eyebrow">JOBSEEK CANDIDATE PORTAL</p><h1>My recruitment documents</h1><p class="lead">Upload your CV, passport bio page and certificates securely. These documents are stored in a private JobSeek storage area.</p><div class="job" style="padding:24px"><form id="docForm"><label>Document type<select id="type" required style="width:100%;padding:12px;margin:6px 0 14px"><option value="cv">CV</option><option value="passport">Passport bio page</option><option value="certificate">Certificate</option><option value="qualification">Qualification</option><option value="work_permit">Work permit</option><option value="other">Other</option></select></label><label>Choose file<input id="file" type="file" required accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="width:100%;padding:12px;margin:6px 0 14px"></label><button class="btn" type="submit">Upload securely</button></form><p id="status" class="micro" role="status"></p></div><div class="job" style="margin-top:20px;padding:24px"><h2>Uploaded documents</h2><div id="list">Loading…</div></div><p><a href="candidate-dashboard.html">← Candidate dashboard</a></p></div></main><script src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
let client,user;const $=x=>document.getElementById(x);async function extractCvText(file){const n=file.name.toLowerCase();if(n.endsWith('.docx')){const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value||''}if(n.endsWith('.pdf')){const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs');const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let out='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),ct=await pg.getTextContent();out+=ct.items.map(x=>x.str).join(' ')+'\\n'}return out}if(/\.txt$/i.test(n))return await file.text();return ''}
async function saveCvToEngine(text){if(!text.trim())return;let p=await client.from('candidate_profiles').select('id,target_job,profession').eq('user_id',user.id).maybeSingle();if(!p.data){const ins=await client.from('candidate_profiles').insert({user_id:user.id,full_name:user.user_metadata?.full_name||user.email?.split('@')[0]||'Candidate'}).select('id,target_job,profession').single();if(ins.error)throw ins.error;p=ins}const row={candidate_id:p.data.id,target_role:p.data.target_job||p.data.profession||'Professional',source_cv_text:text,updated_at:new Date().toISOString(),locked:false,application_eligible:false};const old=await client.from('jobseek_smart_cv_profiles').select('id').eq('candidate_id',p.data.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();const r=old.data?.id?await client.from('jobseek_smart_cv_profiles').update(row).eq('id',old.data.id):await client.from('jobseek_smart_cv_profiles').insert(row);if(r.error)throw r.error}const allowed=['application/pdf','image/jpeg','image/png','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
async function init(){if(!JobSeekSupabase.configured){$('status').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const r=await client.auth.getUser();if(!r.data.user){location.href='auth.html';return}user=r.data.user;load()}
async function load(){const r=await client.from('jobseek_documents').select('id,document_type,file_name,verification_status,created_at,storage_path').eq('candidate_id',user.id);if(r.error){$('list').textContent=r.error.message;return}if(!r.data.length){$('list').textContent='No documents uploaded yet.';return}$('list').innerHTML=r.data.map(d=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><strong>${d.document_type}</strong> — ${d.file_name}<br>Status: ${d.verification_status}</div>`).join('')}
$('docForm').onsubmit=async e=>{e.preventDefault();const f=$('file').files[0];if(!f)return;if(!allowed.includes(f.type)){ $('status').textContent='File type not allowed.';return }if(f.size>10*1024*1024){$('status').textContent='Maximum file size is 10 MB.';return} $('status').textContent='Uploading…';const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${user.id}/${$('type').value}/${crypto.randomUUID()}-${safe}`;const up=await client.storage.from('jobseek-documents').upload(path,f,{contentType:f.type,upsert:false});if(up.error){$('status').textContent=up.error.message;return}const row=await client.from('jobseek_documents').insert({candidate_id:user.id,document_type:$('type').value,file_name:f.name,storage_path:path,mime_type:f.type,file_size:f.size});if(row.error){await client.storage.from('jobseek-documents').remove([path]);$('status').textContent=row.error.message;return}if($('type').value==='cv'){try{$('status').textContent='CV uploaded. Extracting CV text for the matching engine…';const text=await extractCvText(f);if(text.trim())await saveCvToEngine(text);else $('status').textContent='CV uploaded. This file format has no readable text; please also use the Smart CV text area or upload a text-based PDF/DOCX.';}catch(err){$('status').textContent='CV uploaded, but engine indexing needs attention: '+err.message;return}}$('status').textContent='Uploaded successfully ✓';$('file').value='';load()};init();</script></body></html>
