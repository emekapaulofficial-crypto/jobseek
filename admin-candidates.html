<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Candidate Ranking</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><p class="eyebrow">JOBSEEK RECRUITMENT INTELLIGENCE</p><h1>Candidate ranking</h1><p class="lead">Prioritize candidates by JobSeek readiness and profile completeness. Scores are decision-support only.</p><div class="job" style="padding:18px;margin-bottom:18px"><input id="search" placeholder="Search candidate, profession or target job" style="width:100%"></div><div id="list">Loading candidates…</div><p><a href="admin-dashboard.html">← Admin dashboard</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>let client,user,rows=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function words(x){return String(x||'').split(/[,\s/|]+/).map(s=>s.trim()).filter(s=>s.length>2)}function readiness(p,docs){let n=0,total=14;['full_name','phone','country_of_residence','profession','target_job','years_experience','education','availability'].forEach(k=>{if(p[k]!==null&&p[k]!==undefined&&String(p[k]).trim())n++});['skills','languages','preferred_countries','preferred_job_types'].forEach(k=>{if(Array.isArray(p[k])&&p[k].length)n++});const types=new Set((docs||[]).map(d=>d.document_type));if(types.has('cv'))n++;if(types.has('passport'))n++;if(types.has('certificate')||types.has('qualification'))n++;return Math.round(n/total*100)}async function init(){if(!JobSeekSupabase.configured){$('list').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const u=await client.auth.getUser();if(!u.data.user){location.href='auth.html';return}user=u.data.user;const me=await client.from('jobseek_accounts').select('role').eq('id',user.id).single();if(me.error||!['admin','agent'].includes(me.data.role)){$('list').textContent='Access denied.';return}const p=await client.from('candidate_profiles').select('*').order('updated_at',{ascending:false});if(p.error){$('list').textContent=p.error.message;return}const ids=p.data.map(x=>x.id);let d=[];if(ids.length){const r=await client.from('jobseek_documents').select('candidate_id,document_type').in('candidate_id',ids);d=r.data||[]}rows=p.data.map(x=>({p:x,docs:d.filter(y=>y.candidate_id===x.id),score:readiness(x,d.filter(y=>y.candidate_id===x.id))})).sort((a,b)=>b.score-a.score);render()}function render(){const q=$('search').value.toLowerCase().trim();const out=rows.filter(x=>!q||[x.p.full_name,x.p.profession,x.p.target_job,x.p.country_of_residence,(x.p.skills||[]).join(' ')].join(' ').toLowerCase().includes(q));$('list').innerHTML=out.length?out.map(x=>`<article class="job" style="padding:20px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">${esc(x.p.full_name||'Unnamed candidate')}</h2><p>${esc(x.p.profession||x.p.target_job||'Profession not set')} · ${esc(x.p.country_of_residence||'')}</p></div><strong style="font-size:28px">${x.score}%</strong></div><p><strong>Target:</strong> ${esc(x.p.target_job||'—')} · <strong>Experience:</strong> ${esc(x.p.years_experience||0)} years</p><p><strong>Skills:</strong> ${esc((x.p.skills||[]).join(', ')||'—')}</p><p><strong>Documents:</strong> ${esc(x.docs.map(d=>d.document_type).join(', ')||'None uploaded')}</p>${x.score>=70?'<p>✓ Meets the 70% JobSeek readiness target.</p>':'<p>⚠ Needs profile/document improvements before priority review.</p>'}</article>`).join(''):'No matching candidates.'}$('search').oninput=render}init();</script></body></html>
