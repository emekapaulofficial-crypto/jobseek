<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Services & Revenue</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><p class="eyebrow">JOBSEEK ADMIN</p><h1>Services & Revenue</h1><p class="lead">Manage candidate support requests and record payments. This dashboard does not imply that a payment guarantees employment, an offer, or a visa.</p><div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0"></div><div class="job" style="padding:20px"><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Candidate</th><th>Service</th><th>Amount</th><th>Payment</th><th>Service status</th><th>Agent</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></div><p><a href="admin-dashboard.html">← Admin dashboard</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>let client,user,data=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const serviceStatuses=['requested','awaiting_payment','processing','waiting_for_candidate','completed','cancelled'];const payStatuses=['unpaid','pending','paid','refunded'];async function init(){if(!JobSeekSupabase.configured){$('rows').innerHTML='<tr><td colspan="6">Supabase public key is not configured yet.</td></tr>';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const u=await client.auth.getUser();if(!u.data.user){location.href='auth.html';return}user=u.data.user;const me=await client.from('jobseek_accounts').select('role').eq('id',user.id).single();if(me.error||!['admin','agent'].includes(me.data.role)){$('rows').innerHTML='<tr><td colspan="6">Access denied.</td></tr>';return}const r=await client.from('jobseek_service_requests').select('id,candidate_id,service_id,amount,currency,payment_status,status,assigned_agent_id,requested_at,jobseek_services(name),candidate_profiles(full_name),jobseek_accounts:assigned_agent_id(full_name)').order('requested_at',{ascending:false});if(r.error){$('rows').innerHTML=`<tr><td colspan="6">${esc(r.error.message)}</td></tr>`;return}data=r.data||[];render()}function render(){const paid=data.filter(x=>x.payment_status==='paid').reduce((s,x)=>s+Number(x.amount||0),0);const pending=data.filter(x=>x.payment_status!=='paid'&&x.payment_status!=='refunded').reduce((s,x)=>s+Number(x.amount||0),0);$('stats').innerHTML=[['Requests',data.length],['Paid revenue','₦'+paid.toLocaleString()],['Pending payments','₦'+pending.toLocaleString()],['Completed',data.filter(x=>x.status==='completed').length]].map(x=>`<div class="job" style="padding:16px"><strong>${x[0]}</strong><div style="font-size:25px">${x[1]}</div></div>`).join('');$('rows').innerHTML=data.length?data.map(x=>`<tr><td>${esc(x.candidate_profiles?.full_name||'Candidate')}</td><td>${esc(x.jobseek_services?.name||'Service')}</td><td>${esc(x.currency||'NGN')} ${Number(x.amount||0).toLocaleString()}</td><td><select data-pay="${x.id}">${payStatuses.map(s=>`<option ${s===x.payment_status?'selected':''}>${s}</option>`).join('')}</select></td><td><select data-status="${x.id}">${serviceStatuses.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(x.jobseek_accounts?.full_name||'Unassigned')}</td></tr>`).join(''):'<tr><td colspan="6">No service requests yet.</td></tr>'}document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.pay){const patch={payment_status:t.value,paid_at:t.value==='paid'?new Date().toISOString():null};const r=await client.from('jobseek_service_requests').update(patch).eq('id',t.dataset.pay);if(r.error)alert(r.error.message);else init()}if(t.dataset.status){const patch={status:t.value,completed_at:t.value==='completed'?new Date().toISOString():null};const r=await client.from('jobseek_service_requests').update(patch).eq('id',t.dataset.status);if(r.error)alert(r.error.message);else init()}});init();</script></body></html>
