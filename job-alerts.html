<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Alerts | JobSeek</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">J</span><b>Job<span>Seek</span></b></a><nav><a href="jobs.html">Find Jobs</a><a href="portfolio.html">Portfolio</a><a href="candidate-dashboard.html">Dashboard</a></nav></div></header><main><section class="section"><div class="container"><p class="eyebrow">FRESH JOB ALERTS</p><h1>Get matching vacancies as soon as they are found.</h1><p class="lead">Choose what you want and how often JobSeek should notify you. Instant alerts are designed for fresh listings so you can apply early.</p><div class="job"><label><input type="checkbox" id="enabled"> Enable job alerts</label><label>Email address</label><input id="email" type="email" placeholder="you@example.com"><label>Keywords / roles</label><input id="keywords" placeholder="Electrician, Welder, Web Developer"><label>Countries / locations</label><input id="locations" placeholder="UK, Germany, Canada, Remote"><label>Minimum match score</label><select id="score"><option value="70">70%+</option><option value="80">80%+</option><option value="90">90%+</option></select><label>Visa sponsorship</label><select id="visa"><option value="all">All suitable jobs</option><option value="explicit">Only explicitly advertised sponsorship</option></select><label>Frequency</label><select id="frequency"><option value="instant">Instant — fresh matching jobs</option><option value="daily">Daily digest</option><option value="weekly">Weekly digest</option></select><button class="btn" id="save">Save alert settings</button><p id="status" class="micro"></p></div></div></section></main><script>const K='jobseek_alerts';const $=x=>document.getElementById(x);const d=JSON.parse(localStorage.getItem(K)||'{}');$('enabled').checked=!!d.enabled;$('email').value=d.email||'';$('keywords').value=d.keywords||'';$('locations').value=d.locations||'';$('score').value=d.score||'70';$('visa').value=d.visa||'all';$('frequency').value=d.frequency||'instant';$('save').onclick=()=>{const x={enabled:$('enabled').checked,email:$('email').value.trim(),keywords:$('keywords').value.trim(),locations:$('locations').value.trim(),score:$('score').value,visa:$('visa').value,frequency:$('frequency').value};localStorage.setItem(K,JSON.stringify(x));$('status').textContent=x.enabled?'Saved. Live email delivery requires the JobSeek notification backend/provider to be configured.':'Saved. Alerts are off.'};</script></body></html>
