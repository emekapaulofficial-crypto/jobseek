<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Job Matches</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><p class="eyebrow">JOBSEEK SMART MATCH</p><h1>Jobs matched to your profile</h1><p class="lead">We compare your profile with verified JobSeek agency placements. Match scores are guidance, not a guarantee of employment.</p><div id="content">Loading matches…</div><p><a href="candidate-dashboard.html">← Candidate dashboard</a> · <a href="agency-jobs.html">Browse all agency jobs</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
let client,user,profile;const $=id=>document.getElementById(id);const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9+.# -]/g,' ');const words=x=>norm(x).split(/[,\s/|]+/).map(s=>s.trim()).filter(s=>s.length>2);function overlap(a,b){const A=new Set(words(a)),B=new Set(words(b));return [...A].filter(x=>B.has(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){if(!JobSeekSupabase.configured){$('content').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const u=await client.auth.getUser();if(!u.data.user){location.href='auth.html';return}user=u.data.user;const p=await client.from('candidate_profiles').select('*').eq('user_id',user.id).maybeSingle();if(p.error||!p.data){$('content').innerHTML='<div class="job" style="padding:20px">Complete your profile before viewing smart matches.</div>';return}profile=p.data;const j=await client.from('agency_jobs').select('id,title,description,country,city,job_type,category,salary_min,salary_max,salary_currency,visa_sponsorship,requirements,benefits,employers(company_name,verification_status)').eq('status','published').eq('verification_status','verified');if(j.error){$('content').textContent=j.error.message;return}const matches=j.data.map(job=>score(job)).sort((a,b)=>b.score-a.score);if(!matches.length){$('content').textContent='No verified agency placements are currently published.';return}$('content').innerHTML=matches.map(m=>`<article class="job" style="padding:22px;margin-bottom:16px"><div style="font-size:28px;font-weight:700">${m.score}% Match</div><h2>${esc(m.job.title)}</h2><p><strong>${esc(m.job.employers?.company_name||'Verified Employer')}</strong> ✓</p><p>${esc(m.job.city||'')} ${esc(m.job.country||'')} · ${esc(m.job.job_type||'')}</p><p>${esc(m.job.description||'').slice(0,500)}</p><p><strong>Matched:</strong> ${m.matched.length?m.matched.map(esc).join(', '):'Profile/job information'}</p><p><strong>Potential gaps:</strong> ${m.missing.length?m.missing.map(esc).join(', '):'None detected'}</p><a class="btn" href="agency-jobs.html">View & apply</a></article>`).join('')}
function score(j){const profileText=[profile.profession,profile.target_job,profile.skills,profile.education,profile.experience,profile.languages,profile.preferred_job_types,profile.preferred_countries].join(' ');const jobText=[j.title,j.category,j.description,j.requirements,j.job_type,j.country].join(' ');const matched=overlap(profileText,jobText);const required=words(j.requirements);const missing=required.filter(x=>!words(profileText).includes(x)).slice(0,8);let s=35+Math.min(35,matched.length*5);if(profile.preferred_countries&&norm(profile.preferred_countries).includes(norm(j.country)))s+=10;if(profile.preferred_job_types&&norm(profile.preferred_job_types).includes(norm(j.job_type)))s+=5;if(j.visa_sponsorship)s+=5;if(profile.years_experience&&/experience/i.test(j.requirements||''))s+=5;if(profile.education&&/certificate|qualification|diploma|degree/i.test(j.requirements||''))s+=5;return{job:j,score:Math.min(100,Math.round(s)),matched,missing}}init();</script></body></html>
