name: JobSeek Public Feed Publisher

on:
  push:
    branches: [main]
    paths:
      - 'jobs.json'
      - '.github/workflows/public-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact browser feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs=[]
          for j in src.get('jobs',[]):
              if not isinstance(j,dict): continue
              if str(j.get('source','')).strip().lower()=='jobicy': continue
              if 'jobicy.com' in str(j.get('url','')).lower() or 'jobicy.com' in str(j.get('apply_url','')).lower(): continue
              jobs.append({'id':j.get('id',''),'title':j.get('title',''),'company':j.get('company',''),'location':j.get('location',''),'country':j.get('country',''),'description':str(j.get('description',''))[:900],'url':j.get('url',''),'apply_url':j.get('apply_url',''),'source':j.get('source',''),'source_url':j.get('source_url',''),'published_at':j.get('published_at',''),'closing_date':j.get('closing_date','Not specified'),'category':j.get('category','Other'),'employment_type':j.get('employment_type',''),'salary':j.get('salary',''),'remote':bool(j.get('remote')),'visa_sponsorship':bool(j.get('visa_sponsorship')),'visa_evidence':j.get('visa_evidence',[]),'verification_status':j.get('verification_status','NOT CONFIRMED'),'direct_employer':bool(j.get('direct_employer'))})
          Path('public-jobs.json').write_text(json.dumps({'count':len(jobs),'updated_at':src.get('updated_at',''),'jobs':jobs},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(f'Published compact browser feed: {len(jobs)} jobs')
          PY
      - name: Commit compact feed
        run: |
          git config user.name 'JobSeek AI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-jobs.json
          if git diff --cached --quiet; then echo 'No compact feed changes.'; else git commit -m 'chore: publish compact browser job feed'; git push; fi
