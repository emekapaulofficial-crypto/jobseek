name: JobSeek - Automatic Job Upload (3-day)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pablo-research.yml'
      - '.github/workflows/job-update.yml'
      - 'scripts/ai_job_agent.py'
      - 'scripts/purge_jobicy.py'
      - 'scripts/add_trusted_job_sources.py'
      - 'scripts/cleanup_jobs.py'
      - 'scripts/reclassify_jobs.py'
      - 'scripts/pablo_research.py'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobseek-job-data
  cancel-in-progress: false

jobs:
  upload:
    name: Automatically discover, verify and publish jobs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run JobSeek AI Job Agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: gb,us,ca,au,de,fr,nl,nz,sg,za,ng
          ADZUNA_QUERIES: construction,electrician,carpenter,welder,plumber,mason,driver,warehouse,healthcare,engineering,technology,hospitality,cleaning,finance,sales
          JOB_URL_CHECK_LIMIT: '1000'
          JOB_MAX_AGE_DAYS: '3'
        run: python scripts/pablo_research.py
      - name: Ensure every supported category is searched
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/job-feeds.json').read_text())
          print('Pablo coverage targets:', len(cfg.get('job_categories',[])), 'categories')
          print('Priority terms:', len(cfg.get('priority_search_terms',[])))
          PY
      - name: Permanently purge Jobicy records
        run: python scripts/purge_jobicy.py
      - name: Add trusted remote sources
        run: python scripts/add_trusted_job_sources.py
      - name: Permanently purge Jobicy again after source enrichment
        run: python scripts/purge_jobicy.py
      - name: Remove expired and unsafe listings
        run: python scripts/cleanup_jobs.py
      - name: Paul automatic verification and publication gate
        run: python scripts/paul_guardian.py
      - name: Classify jobs and enforce freshness window
        run: python scripts/reclassify_jobs.py
      - name: Normalize public feed before validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path('jobs.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          jobs=[]; seen=set(); dropped=0
          for job in data.get('jobs', []):
              if not isinstance(job, dict): dropped+=1; continue
              job_id=str(job.get('id') or '').strip()
              title=str(job.get('title') or '').strip()
              location=str(job.get('location') or 'See source listing').strip()
              source=str(job.get('source') or '').strip()
              url=str(job.get('url') or job.get('source_url') or '').strip()
              apply_url=str(job.get('apply_url') or url).strip()
              if not job_id or not title or not source or not url or not apply_url: dropped+=1; continue
              if job_id in seen or any('jobicy.com' in str(job.get(k,'')).lower() for k in ('url','apply_url','source_url')) or source.lower()=='jobicy': dropped+=1; continue
              job['company']=str(job.get('company') or job.get('employer') or '').strip() or 'Employer not specified by source'
              job['location']=location; job['url']=url; job['apply_url']=apply_url
              status=str(job.get('verification_status') or 'NOT CONFIRMED').strip().upper()
              job['verification_status']='source_verified' if status=='SOURCE_VERIFIED' else (status if status in {'VERIFIED','NOT CONFIRMED'} else 'NOT CONFIRMED')
              seen.add(job_id); jobs.append(job)
          data['jobs']=jobs
          data['count']=len(jobs)
          data['verified_count']=sum(j.get('verification_status')=='VERIFIED' for j in jobs)
          data['not_confirmed_count']=sum(j.get('verification_status')!='VERIFIED' for j in jobs)
          data['sources']=sorted(set(str(j.get('source') or 'Connected source') for j in jobs))
          data['freshness_window_days']=3
          data['updated_at']=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Normalized {len(jobs)} publishable listings; dropped {dropped} invalid/duplicate/blocked records.')
          PY
      - name: Final Jobicy leak check
        run: |
          python - <<'PY'
          import json
          jobs=json.load(open('jobs.json',encoding='utf-8')).get('jobs',[])
          leaked=[j for j in jobs if str(j.get('source','')).strip().lower()=='jobicy' or any('jobicy.com' in str(j.get(k,'')).lower() for k in ('url','apply_url','source_url'))]
          if leaked: raise SystemExit(f'Jobicy leaked into public feed: {len(leaked)}')
          print(f'Jobicy check passed: {len(jobs)} listings remain.')
          PY
      - name: Validate published job feed
        run: |
          python - <<'PY'
          import json
          data=json.load(open('jobs.json',encoding='utf-8')); jobs=data.get('jobs',[])
          required=('id','title','company','location','url','apply_url','source','verification_status')
          allowed={'VERIFIED','NOT CONFIRMED','source_verified'}; seen=set()
          for job in jobs:
              missing=[k for k in required if not job.get(k)]
              if missing: raise SystemExit(f"Invalid job {job.get('id')}: missing {missing}")
              if job['verification_status'] not in allowed: raise SystemExit(f"Invalid verification status: {job.get('id')}")
              if job['id'] in seen: raise SystemExit(f"Duplicate job id: {job.get('id')}")
              seen.add(job['id'])
              if not str(job['url']).startswith(('http://','https://')) or not str(job['apply_url']).startswith(('http://','https://')): raise SystemExit(f"Invalid URL: {job['id']}")
              if job.get('visa_sponsorship') and not job.get('visa_evidence'): raise SystemExit(f"Visa sponsorship has no evidence: {job['id']}")
          print(f'Validated {len(jobs)} public JobSeek listings.')
          PY
      - name: Publish freshness summary
        run: |
          python - <<'PY'
          import json
          data=json.load(open('jobs.json',encoding='utf-8'))
          print('Freshness window:',data.get('freshness_window_days',3),'days')
          print('Published listings:',data.get('count',0))
          print('Verified:',data.get('verified_count',0),'Not confirmed:',data.get('not_confirmed_count',0))
          print('Sources:',', '.join(data.get('sources',[])))
          print('Updated:',data.get('updated_at'))
          PY
      - name: Commit refreshed job data
        run: |
          git config user.name 'Pablo - Job Research Manager'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if git diff --cached --quiet; then echo 'No job data changes.'; else git commit -m 'chore: publish fresh global jobs without Jobicy'; git pull --rebase origin main; git push; fi
