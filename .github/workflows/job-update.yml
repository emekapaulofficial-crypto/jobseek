name: JobSeek AI Agent - Global Job Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-update.yml'
      - 'scripts/ai_job_agent.py'
      - 'scripts/purge_jobicy.py'
      - 'scripts/add_trusted_job_sources.py'
      - 'scripts/cleanup_jobs.py'
  schedule:
    # Nigeria/WAT is UTC+1. Run at 12:00am, 12:00pm and 6:00pm Nigeria time.
    - cron: '0 23,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobseek-ai-agent
  cancel-in-progress: false

jobs:
  discover:
    name: Discover, verify, clean and publish jobs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JobSeek AI Job Agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: gb,us,ca,au,de,fr,nl,nz,sg,za,ng
          ADZUNA_QUERIES: construction,electrician,carpenter,welder,plumber,mason,driver,warehouse,healthcare,engineering,technology,hospitality,cleaning,finance,sales
          JOB_URL_CHECK_LIMIT: '100'
        run: python scripts/ai_job_agent.py

      - name: Permanently purge Jobicy records
        run: python scripts/purge_jobicy.py

      - name: Add trusted remote sources
        run: python scripts/add_trusted_job_sources.py

      - name: Permanently purge Jobicy again after source enrichment
        run: python scripts/purge_jobicy.py

      - name: Remove expired and unsafe listings
        run: python scripts/cleanup_jobs.py

      - name: Normalize public feed before validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('jobs.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          source_jobs = data.get('jobs', [])
          jobs = []
          seen = set()
          dropped = 0

          for job in source_jobs:
              if not isinstance(job, dict):
                  dropped += 1
                  continue
              job_id = str(job.get('id') or '').strip()
              title = str(job.get('title') or '').strip()
              location = str(job.get('location') or 'See source listing').strip()
              source = str(job.get('source') or '').strip()
              url = str(job.get('url') or job.get('source_url') or '').strip()
              apply_url = str(job.get('apply_url') or url).strip()
              if not job_id or not title or not source or not url or not apply_url:
                  dropped += 1
                  continue
              if job_id in seen:
                  dropped += 1
                  continue
              if 'jobicy.com' in url.lower() or 'jobicy.com' in apply_url.lower() or 'jobicy.com' in str(job.get('source_url') or '').lower() or source.lower() == 'jobicy':
                  dropped += 1
                  continue
              company = str(job.get('company') or job.get('employer') or '').strip()
              job['company'] = company or 'Employer not specified by source'
              job['location'] = location
              job['url'] = url
              job['apply_url'] = apply_url
              status = str(job.get('verification_status') or 'NOT CONFIRMED').strip().upper()
              if status == 'SOURCE_VERIFIED':
                  status = 'source_verified'
              if status not in {'VERIFIED', 'NOT CONFIRMED', 'source_verified'}:
                  status = 'NOT CONFIRMED'
              job['verification_status'] = status
              seen.add(job_id)
              jobs.append(job)

          data['jobs'] = jobs
          data['count'] = len(jobs)
          data['verified_count'] = sum(1 for j in jobs if j.get('verification_status') == 'VERIFIED')
          data['not_confirmed_count'] = sum(1 for j in jobs if j.get('verification_status') != 'VERIFIED')
          data['sources'] = sorted(set(str(j.get('source') or 'Connected source') for j in jobs))
          data['updated_at'] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Normalized {len(jobs)} publishable listings; dropped {dropped} invalid/duplicate/blocked records.')
          PY

      - name: Final Jobicy leak check
        run: |
          python - <<'PY'
          import json
          data = json.load(open('jobs.json', encoding='utf-8'))
          jobs = data.get('jobs', [])
          leaked = [j for j in jobs if str(j.get('source', '')).strip().lower() == 'jobicy' or 'jobicy.com' in str(j.get('url', '')).lower() or 'jobicy.com' in str(j.get('apply_url', '')).lower() or 'jobicy.com' in str(j.get('source_url', '')).lower()]
          if leaked:
              raise SystemExit(f'Jobicy leaked into public feed: {len(leaked)}')
          print(f'Jobicy check passed: {len(jobs)} listings remain.')
          PY

      - name: Validate published job feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs = data.get('jobs', [])
          required = ('id', 'title', 'company', 'location', 'url', 'apply_url', 'source', 'verification_status')
          allowed = {'VERIFIED', 'NOT CONFIRMED', 'source_verified'}
          seen = set()
          for job in jobs:
              missing = [key for key in required if not job.get(key)]
              if missing:
                  raise SystemExit(f"Invalid job {job.get('id')}: missing {missing}")
              if job['verification_status'] not in allowed:
                  raise SystemExit(f"Invalid verification status for {job.get('id')}: {job['verification_status']}")
              if job['id'] in seen:
                  raise SystemExit(f"Duplicate job id: {job.get('id')}")
              seen.add(job['id'])
              if not str(job['url']).startswith(('http://', 'https://')) or not str(job['apply_url']).startswith(('http://', 'https://')):
                  raise SystemExit(f"Invalid application/source URL: {job['id']}")
              if job.get('visa_sponsorship') and not job.get('visa_evidence'):
                  raise SystemExit(f"Visa sponsorship has no evidence: {job['id']}")
          if any('jobicy.com' in str(j.get(k, '')).lower() for j in jobs for k in ('url', 'apply_url', 'source_url')):
              raise SystemExit('Jobicy URL leaked into public feed')
          if any(str(j.get('source', '')).strip().lower() == 'jobicy' for j in jobs):
              raise SystemExit('Jobicy source leaked into public feed')
          if data.get('count') != len(jobs) or not data.get('updated_at'):
              raise SystemExit('jobs.json metadata is invalid')
          print(f'Validated {len(jobs)} public JobSeek listings.')
          PY

      - name: Commit refreshed job data
        run: |
          git config user.name 'JobSeek AI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if git diff --cached --quiet; then
            echo 'No job data changes.'
          else
            git commit -m 'chore: publish fresh global jobs without Jobicy'
            git push
          fi
