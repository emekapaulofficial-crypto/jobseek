name: JobSeek - Update Jobs Every 4 Hours
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run multi-source job updater
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: gb,us,ca,au,de,fr,nl,nz,sg,za,ng
          ADZUNA_QUERIES: electrician,construction,driver,cleaner,cook,warehouse,hospitality,healthcare,engineering,technology
        run: python scripts/fetch_jobs.py
      - name: Commit updated job data
        run: |
          git config user.name 'JobSeek Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if git diff --cached --quiet; then
            echo 'No job data changes to commit.'
          else
            git commit -m 'chore: refresh global job listings'
            git push
          fi
