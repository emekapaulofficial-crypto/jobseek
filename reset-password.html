<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Reset Password</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page"><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">J</span><b>Job<span>Seek</span></b></a></div></header>
<main class="section"><div class="container" style="max-width:520px"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Create a new password</h1><p class="lead">Choose a strong password to secure your JobSeek account.</p>
<div class="job" style="padding:24px"><form id="resetForm" style="display:grid;gap:10px"><label>New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><label>Confirm new password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Repeat your password"><button class="btn" type="submit">Update password</button><div id="msg" class="micro" role="status"></div></form></div><p><a href="auth.html">← Back to sign in</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const form=document.getElementById('resetForm'),msg=document.getElementById('msg');
const client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
client.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)msg.textContent='You can now choose your new password.'});
form.onsubmit=async e=>{e.preventDefault();msg.textContent='Updating password…';if(password.value!==confirm.value){msg.textContent='Passwords do not match.';return}try{const s=await client.auth.getSession();if(!s.data.session)throw Error('This reset link is expired or invalid. Request a new one.');const r=await client.auth.updateUser({password:password.value});if(r.error)throw r.error;msg.textContent='Password updated successfully. Redirecting to sign in…';setTimeout(()=>location.href='auth.html',900)}catch(e){msg.textContent=e.message||'Could not update password.'}};
</script></body></html>
