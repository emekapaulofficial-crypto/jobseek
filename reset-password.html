<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobSeek | Reset Password</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<header><div class="container nav">
<a class="brand" href="index.html"><span class="logo">J</span><b>Job<span>Seek</span></b></a>
</div></header>
<main class="section"><div class="container" style="max-width:520px">
<p class="eyebrow">JOBSEEK ACCOUNT SECURITY</p>
<h1>Create a new password</h1>
<p class="lead">You are securely resetting your JobSeek account password.</p>
<div class="job" style="padding:24px">
<form id="resetForm" style="display:grid;gap:10px">
<label for="password">New password</label>
<input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Repeat your password">
<button class="btn" type="submit">Update password</button>
<div id="msg" class="micro" role="status" aria-live="polite"></div>
</form>
</div>
<p><a href="auth.html">← Back to JobSeek sign in</a></p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const form=document.getElementById('resetForm');
const msg=document.getElementById('msg');
const client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}
});

function showErrorFromUrl(){
  const hash=new URLSearchParams(window.location.hash.replace(/^#/,''));
  const query=new URLSearchParams(window.location.search);
  const code=hash.get('error_code')||query.get('error_code');
  const description=hash.get('error_description')||query.get('error_description');
  if(code||description){
    msg.textContent='This password reset link is invalid or expired. Please request a new JobSeek reset email.';
    return true;
  }
  return false;
}

let recoveryReady=false;
showErrorFromUrl();

client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session){
    recoveryReady=true;
    msg.textContent='Your secure JobSeek recovery session is ready. Choose your new password.';
  }
});

(async()=>{
  if(showErrorFromUrl()) return;
  const result=await client.auth.getSession();
  if(result.data.session){
    recoveryReady=true;
    msg.textContent='Your secure JobSeek recovery session is ready. Choose your new password.';
  }else{
    msg.textContent='Open this page from the newest JobSeek password-reset email.';
  }
})();

form.onsubmit=async e=>{
  e.preventDefault();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  if(password.length<8){msg.textContent='Use at least 8 characters.';return}
  if(password!==confirm){msg.textContent='Passwords do not match.';return}
  msg.textContent='Updating your JobSeek password…';
  try{
    const s=await client.auth.getSession();
    if(!s.data.session&&!recoveryReady) throw Error('This JobSeek reset link is expired or invalid. Request a new one.');
    const r=await client.auth.updateUser({password});
    if(r.error) throw r.error;
    msg.textContent='Password updated successfully. Returning to JobSeek sign in…';
    setTimeout(()=>location.replace('auth.html'),900);
  }catch(e){
    msg.textContent=e.message||'Could not update your JobSeek password.';
  }
};
</script>
</body>
</html>
