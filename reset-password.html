<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Reset Password</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
<main class="section"><div class="container" style="max-width:520px"><h1>Create a new password</h1><div class="job" style="padding:24px"><form id="resetForm" style="display:grid;gap:10px"><input id="password" type="password" minlength="8" required placeholder="New password"><input id="confirm" type="password" minlength="8" required placeholder="Confirm password"><button class="btn">Update password</button><div id="msg" class="micro"></div></form></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const msg=document.getElementById('msg');
const form=document.getElementById('resetForm');
const client=JobSeekSupabase.getClient ? JobSeekSupabase.getClient() : supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
let ready=false;
async function checkRecovery(){
 const session=await client.auth.getSession();
 if(session.data.session){ready=true;msg.textContent='Recovery ready. Enter your new password.';return;}
 const result=await client.auth.exchangeCodeForSession(window.location.href);
 if(!result.error){ready=true;msg.textContent='Recovery ready. Enter your new password.';return;}
 msg.textContent='Open this page from the latest password reset email.';
}
client.auth.onAuthStateChange((event,session)=>{if((event==='PASSWORD_RECOVERY'||session)&&session){ready=true;msg.textContent='Recovery ready. Enter your new password.';}});
checkRecovery();
form.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;const c=document.getElementById('confirm').value;if(p.length<8||p!==c){msg.textContent='Check your password details.';return;}if(!ready)await checkRecovery();const result=await client.auth.updateUser({password:p});if(result.error){msg.textContent=result.error.message;return;}msg.textContent='Password updated. Redirecting...';setTimeout(()=>location.replace('auth.html'),1000);};
</script></body></html>
