<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Saved Jobs</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">J</span><b>Job<span>Seek</span></b></a><button id="menu" type="button" aria-label="Open navigation" aria-expanded="false">☰</button><nav id="nav"><a href="candidate-dashboard.html">Dashboard</a><a href="jobs.html">Find Jobs</a><a href="smart-cv.html">CV & Application Tools</a><a href="job-alerts.html">Notifications</a></nav></div></header><main class="section"><div class="container" style="max-width:980px"><p class="eyebrow">MY WORKSPACE</p><h1>Saved Jobs</h1><p class="lead">Jobs you save stay here until you remove them or the vacancy closes.</p><div id="status" class="job" style="padding:18px">Loading saved jobs…</div><div id="list"></div></div></main><script src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const db=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const u=await db.auth.getUser();if(!u.data.user){location.href='auth.html?mode=login&role=candidate';return}const r=await db.from('jobseek_saved_jobs').select('id,saved_at,jobseek_manual_jobs(*)').eq('user_id',u.data.user.id).order('saved_at',{ascending:false});if(r.error){$('status').textContent=r.error.message;return}const rows=(r.data||[]).filter(x=>x.jobseek_manual_jobs&&x.jobseek_manual_jobs.status==='published');$('status').textContent=rows.length+' saved job'+(rows.length===1?'':'s')+'.';$('list').innerHTML=rows.length?rows.map(x=>{const j=x.jobseek_manual_jobs;const url=j.direct_application_url||j.apply_url||'#';const q=new URLSearchParams({id:j.id,title:j.title,company:j.company||'',location:j.location||'',description:j.description||'',requirements:j.requirements||'',responsibilities:j.responsibilities||'',apply:url,posted:j.posted_at||'',closing:j.closing_date||'',source:j.source||''});return '<article class="job" style="padding:20px;margin:14px 0"><h2>'+esc(j.title)+'</h2><p><strong>'+esc(j.company||'Employer')+'</strong> · '+esc(j.location||'')+'</p><p class="micro">'+esc(j.requirements||'').slice(0,280)+'</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Original Website ↗</a><a class="outline" href="application-assistant.html?'+q.toString()+'">Build CV & Application</a><button class="outline remove-save" data-id="'+x.id+'">Remove</button></div></article>'}).join(''):'<div class="job" style="padding:20px">You have not saved any jobs yet.</div>';document.querySelectorAll('.remove-save').forEach(b=>b.onclick=async()=>{const x=await db.from('jobseek_saved_jobs').delete().eq('id',b.dataset.id);if(x.error)alert(x.error.message);else init()})}init();
</script></body></html>
