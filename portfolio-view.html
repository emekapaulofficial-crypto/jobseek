<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional Portfolio | JobSeek</title><link rel="stylesheet" href="styles.css"></head><body><main><section class="section"><div class="container"><div id="portfolio" class="job">Loading portfolio…</div></div></section></main><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const d=JSON.parse(localStorage.getItem('jobseek_portfolio')||'null');const p=document.getElementById('portfolio');if(!d||!d.name){p.innerHTML='<h1>Portfolio unavailable</h1><p>This portfolio has not been created on this device yet.</p>'}else{p.innerHTML=`<p class="eyebrow">JOBSEEK PROFESSIONAL PORTFOLIO</p>${d.photo?`<img src="${esc(d.photo)}" alt="${esc(d.name)}" style="max-width:140px;border-radius:50%">`:''}<h1>${esc(d.name)}</h1><h2>${esc(d.title)}</h2><p>${esc(d.about)}</p><h3>Skills</h3><p>${esc(d.skills)}</p><h3>Projects</h3>${d.projects.split('\n').filter(Boolean).map(x=>`<article class="job"><p>${esc(x)}</p></article>`).join('')}</div>`}</script></body></html>
