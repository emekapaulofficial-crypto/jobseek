<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Candidate Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><p class="eyebrow">JOBSEEK CANDIDATE PORTAL</p><h1 id="welcome">My recruitment profile</h1></div><button class="outline" id="logout">Log out</button></div><div id="strength" class="job" style="margin:20px 0;padding:20px"><h2>Recruitment Readiness</h2><div id="score" style="font-size:34px;font-weight:700">—%</div><div style="background:#ddd;height:12px;border-radius:8px;overflow:hidden"><div id="bar" style="height:100%;width:0%;background:currentColor"></div></div><p id="strengthText">Checking your profile…</p><ul id="missing"></ul><a class="btn" href="candidate-documents.html">Upload documents</a> <a class="btn" href="profile-builder.html">Improve profile</a></div><div id="notice" class="job" style="margin:20px 0;padding:16px">Loading your profile…</div><form id="profileForm" class="job" style="padding:24px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><label>Full name<input id="full_name" required></label><label>Phone<input id="phone"></label><label>Nationality<input id="nationality"></label><label>Country of residence<input id="country_of_residence"></label><label>City<input id="city"></label><label>Profession<input id="profession"></label><label>Target job<input id="target_job"></label><label>Years of experience<input id="years_experience" type="number" min="0" step="0.5"></label><label>Education<input id="education"></label><label>Visa status<input id="visa_status"></label><label>Availability<input id="availability"></label><label style="grid-column:1/-1">Skills<input id="skills"></label><label style="grid-column:1/-1">Languages<input id="languages"></label><label style="grid-column:1/-1">Preferred countries<input id="preferred_countries"></label><label style="grid-column:1/-1">Preferred job types<input id="preferred_job_types"></label><div style="grid-column:1/-1"><button class="btn" type="submit">Save profile</button><span id="saveStatus" class="micro" style="margin-left:10px"></span></div></form><div class="job" style="margin-top:20px;padding:20px"><h2>Recruitment tracking</h2><div id="applications">No applications loaded yet.</div></div><p><a href="index.html">← Back to JobSeek</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const fields=['full_name','phone','nationality','country_of_residence','city','profession','target_job','years_experience','education','visa_status','availability'];const arrays=['skills','languages','preferred_countries','preferred_job_types'];let client,user,profile,docs=[];const $=id=>document.getElementById(id);function value(id){return $(id).value.trim()}function arr(id){return value(id).split(',').map(x=>x.trim()).filter(Boolean)}
function calculate(){const checks=[['full_name','Full name'],['phone','Phone'],['country_of_residence','Country of residence'],['profession','Profession'],['target_job','Target job'],['years_experience','Work experience'],['education','Education'],['skills','Skills'],['languages','Languages'],['preferred_countries','Preferred countries'],['availability','Availability']];let score=0,missing=[];checks.forEach(([f,n])=>{if(profile?.[f]!==null&&profile?.[f]!==undefined&&String(profile[f]).trim()&&(Array.isArray(profile[f])?profile[f].length:true))score+=Math.round(60/checks.length);else missing.push(n)});const docTypes=new Set(docs.map(d=>d.document_type));if(docTypes.has('cv'))score+=10;else missing.push('CV');if(docTypes.has('passport'))score+=10;else missing.push('Passport bio page');if(docTypes.has('certificate')||docTypes.has('qualification'))score+=10;else missing.push('Certificate/qualification');score=Math.min(100,score);$('score').textContent=score+'%';$('bar').style.width=score+'%';$('strengthText').textContent=score>=70?'Your profile has reached the JobSeek 70% recruitment-readiness target. Keep improving it for stronger matching.':'Complete the missing items to reach the 70% recruitment-readiness target.';$('missing').innerHTML=missing.map(x=>`<li>${x}</li>`).join('')}
async function init(){if(!JobSeekSupabase.configured){$('notice').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='auth.html';return}user=data.user;$('welcome').textContent='Welcome, '+(user.user_metadata?.full_name||user.email||'Candidate');let r=await client.from('candidate_profiles').select('*').eq('user_id',user.id).maybeSingle();if(r.error){$('notice').textContent=r.error.message;return}profile=r.data;if(profile){fields.forEach(f=>$(f).value=profile[f]??'');arrays.forEach(f=>$(f).value=(profile[f]||[]).join(', '));$('notice').textContent='Your profile is saved in Supabase.'}else $('notice').textContent='Complete your profile so JobSeek can match you with overseas placements.';const d=await client.from('jobseek_documents').select('document_type').eq('candidate_id',user.id);docs=d.data||[];calculate();loadApplications()}
$('profileForm').onsubmit=async e=>{e.preventDefault();$('saveStatus').textContent='Saving…';const payload={user_id:user.id};fields.forEach(f=>payload[f]=f==='years_experience'?(value(f)?Number(value(f)):null):value(f));arrays.forEach(f=>payload[f]=arr(f));payload.profile_completed=Boolean(payload.full_name&&payload.profession&&payload.country_of_residence);const r=profile?await client.from('candidate_profiles').update(payload).eq('user_id',user.id):await client.from('candidate_profiles').insert(payload);if(r.error){$('saveStatus').textContent=r.error.message;return}$('saveStatus').textContent='Saved ✓';profile=payload;calculate()};async function loadApplications(){const r=await client.from('applications').select('id,status,submitted_at,agency_jobs(title,country)').order('submitted_at',{ascending:false});if(r.error){$('applications').textContent='Applications unavailable.';return}if(!r.data.length){$('applications').textContent='No agency applications yet.';return}$('applications').innerHTML=r.data.map(a=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><strong>${a.agency_jobs?.title||'Agency placement'}</strong> — ${a.agency_jobs?.country||''}<br>${a.status}</div>`).join('')}$('logout').onclick=async()=>{await client?.auth.signOut();location.href='auth.html'};init();</script></body></html>
