<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Candidate Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="section"><div class="container"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><p class="eyebrow">JOBSEEK CANDIDATE PORTAL</p><h1 id="welcome">My recruitment profile</h1></div><button class="outline" id="logout">Log out</button></div>
<div id="notice" class="job" style="margin:20px 0;padding:16px">Loading your profile…</div>
<form id="profileForm" class="job" style="padding:24px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
<label>Full name<input id="full_name" required></label><label>Phone<input id="phone"></label><label>Nationality<input id="nationality"></label><label>Country of residence<input id="country_of_residence"></label><label>City<input id="city"></label><label>Profession<input id="profession"></label><label>Target job<input id="target_job"></label><label>Years of experience<input id="years_experience" type="number" min="0" step="0.5"></label><label>Education<input id="education"></label><label>Visa status<input id="visa_status" placeholder="e.g. Need employer sponsorship"></label><label>Availability<input id="availability" placeholder="e.g. Immediately"></label><label style="grid-column:1/-1">Skills<input id="skills" placeholder="Electrician, wiring, maintenance"></label><label style="grid-column:1/-1">Languages<input id="languages" placeholder="English, French"></label><label style="grid-column:1/-1">Preferred countries<input id="preferred_countries" placeholder="UK, Germany, Canada"></label><label style="grid-column:1/-1">Preferred job types<input id="preferred_job_types" placeholder="Full-time, contract"></label><div style="grid-column:1/-1"><button class="btn" type="submit">Save profile</button><span id="saveStatus" class="micro" style="margin-left:10px"></span></div></form>
<div class="job" style="margin-top:20px;padding:20px"><h2>Recruitment tracking</h2><p>Applications and placement stages will appear here as they are added to your account.</p><div id="applications">No applications loaded yet.</div></div>
<p><a href="index.html">← Back to JobSeek</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const fields=['full_name','phone','nationality','country_of_residence','city','profession','target_job','years_experience','education','visa_status','availability'];const arrays=['skills','languages','preferred_countries','preferred_job_types'];let client,user,profile;
const $=id=>document.getElementById(id); const notice=$('notice');
function value(id){return $(id).value.trim()}; function arr(id){return value(id).split(',').map(x=>x.trim()).filter(Boolean)}
async function init(){if(!JobSeekSupabase.configured){notice.textContent='Supabase public key is not configured yet.';return} client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='auth.html';return}user=data.user;$('welcome').textContent='Welcome, '+(data.user.user_metadata?.full_name||data.user.email||'Candidate');let r=await client.from('candidate_profiles').select('*').eq('user_id',user.id).maybeSingle();if(r.error){notice.textContent=r.error.message;return}profile=r.data;if(profile){fields.forEach(f=>$(f).value=profile[f]??'');arrays.forEach(f=>$(f).value=(profile[f]||[]).join(', '));notice.textContent='Your profile is saved in Supabase.'}else notice.textContent='Complete your profile so JobSeek can match you with overseas placements.';loadApplications()}
$('profileForm').onsubmit=async e=>{e.preventDefault();$('saveStatus').textContent='Saving…';const payload={user_id:user.id};fields.forEach(f=>payload[f]=f==='years_experience'?(value(f)?Number(value(f)):null):value(f));arrays.forEach(f=>payload[f]=arr(f));payload.profile_completed=Boolean(payload.full_name&&payload.profession&&payload.country_of_residence);const r=profile?await client.from('candidate_profiles').update(payload).eq('user_id',user.id):await client.from('candidate_profiles').insert(payload);if(r.error){$('saveStatus').textContent=r.error.message;return}$('saveStatus').textContent='Saved ✓';profile=payload};
async function loadApplications(){const r=await client.from('applications').select('id,status,submitted_at,agency_jobs(title,country,city)').order('submitted_at',{ascending:false});if(r.error){$('applications').textContent='Applications unavailable.';return}if(!r.data.length){$('applications').textContent='No agency applications yet.';return}$('applications').innerHTML=r.data.map(a=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><strong>${a.agency_jobs?.title||'Agency placement'}</strong> — ${a.agency_jobs?.country||''}<br><span>${a.status}</span></div>`).join('')}
$('logout').onclick=async()=>{await client?.auth.signOut();location.href='auth.html'};init();
</script></body></html>
