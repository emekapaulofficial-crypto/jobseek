<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Messages</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container" style="max-width:820px"><p class="eyebrow">JOBSEEK SECURE MESSAGES</p><h1>Messages</h1><p class="lead">Communicate with your JobSeek recruitment agent about your application or placement.</p><div class="job" style="padding:20px;margin-bottom:18px"><form id="messageForm"><label>Subject<input id="subject" required></label><label style="display:block;margin-top:10px">Message<textarea id="message" rows="5" required></textarea></label><button class="btn" style="margin-top:10px" type="submit">Send message</button></form><p id="status" class="micro"></p></div><div class="job" style="padding:20px"><h2>Conversation</h2><div id="messages">Loading…</div></div><p><a href="candidate-dashboard.html">← Candidate dashboard</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>let client,user;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){if(!JobSeekSupabase.configured){$('messages').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const r=await client.auth.getUser();if(!r.data.user){location.href='auth.html';return}user=r.data.user;load()}async function load(){const r=await client.from('jobseek_messages').select('id,sender_id,recipient_id,subject,message,read_at,created_at').or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`).order('created_at',{ascending:true});if(r.error){$('messages').textContent=r.error.message;return}if(!r.data.length){$('messages').textContent='No messages yet.';return}$('messages').innerHTML=r.data.map(m=>`<div style="padding:14px 0;border-bottom:1px solid #ddd"><strong>${m.sender_id===user.id?'You':'JobSeek Agent'}</strong> · ${new Date(m.created_at).toLocaleString()}<br><strong>${esc(m.subject||'')}</strong><p>${esc(m.message)}</p></div>`).join('');const unread=r.data.filter(m=>m.recipient_id===user.id&&!m.read_at).map(m=>m.id);if(unread.length)await client.from('jobseek_messages').update({read_at:new Date().toISOString()}).in('id',unread)}$('messageForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='Finding your JobSeek agent…';const a=await client.from('jobseek_accounts').select('id').in('role',['agent','admin']).limit(1).maybeSingle();if(a.error||!a.data){$('status').textContent='No recruitment agent is currently available.';return}const r=await client.from('jobseek_messages').insert({sender_id:user.id,recipient_id:a.data.id,subject:$('subject').value.trim(),message:$('message').value.trim()});if(r.error){$('status').textContent=r.error.message;return}$('status').textContent='Message sent ✓';$('subject').value='';$('message').value='';load()};init();</script></body></html>
