<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Candidate Login</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="section"><div class="container" style="max-width:620px">
<p class="eyebrow">JOBSEEK RECRUITMENT</p><h1>Candidate account</h1><p class="lead">Create your free JobSeek account to save your recruitment profile, documents and application progress.</p>
<div class="job" style="padding:24px">
<div style="display:flex;gap:8px;margin-bottom:18px"><button class="btn" id="loginTab">Log in</button><button class="outline" id="signupTab">Create account</button></div>
<form id="authForm"><label>Email</label><input id="email" type="email" required autocomplete="email" style="width:100%;padding:12px;margin:6px 0 14px"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" style="width:100%;padding:12px;margin:6px 0 14px"><div id="nameWrap" hidden><label>Full name</label><input id="fullName" autocomplete="name" style="width:100%;padding:12px;margin:6px 0 14px"></div><button class="btn" id="submitBtn" type="submit">Log in</button></form><p id="message" class="micro" role="status"></p><p class="micro">By continuing, you agree to JobSeek's terms. Candidate recruitment fees: <strong>₦0 / $0</strong>. JobSeek uses an employer-pays recruitment model.</p></div>
<p><a href="index.html">← Back to JobSeek</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const form=document.getElementById('authForm'), msg=document.getElementById('message'), nameWrap=document.getElementById('nameWrap'), fullName=document.getElementById('fullName'), submit=document.getElementById('submitBtn'); let mode='login';
function setMode(m){mode=m;nameWrap.hidden=m==='login';submit.textContent=m==='login'?'Log in':'Create free account';document.getElementById('loginTab').className=m==='login'?'btn':'outline';document.getElementById('signupTab').className=m==='signup'?'btn':'outline'}
document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('signupTab').onclick=()=>setMode('signup');
form.onsubmit=async e=>{e.preventDefault();msg.textContent='Please wait…';try{if(!JobSeekSupabase.configured)throw Error('Supabase public key is not configured yet.');const client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);let result;if(mode==='login')result=await client.auth.signInWithPassword({email:email.value,password:password.value});else result=await client.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:fullName.value,role:'candidate'}}});if(result.error)throw result.error;msg.textContent=mode==='login'?'Login successful. Redirecting…':'Account created. Check your email if confirmation is required.';if(mode==='login')setTimeout(()=>location.href='candidate-dashboard.html',500)}catch(err){msg.textContent=err.message||'Authentication failed.'}};
</script></body></html>
