<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Employer Portal</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container" style="max-width:820px"><p class="eyebrow">JOBSEEK EMPLOYER & PARTNER PORTAL</p><h1>Employer verification</h1><p class="lead">Only approved employers can publish JobSeek agency-managed vacancies. Approval is required before a Verified Employer badge is displayed.</p><div class="job" style="padding:24px"><form id="employerForm" style="display:grid;gap:12px"><label>Company name<input id="company_name" required></label><label>Legal name<input id="legal_name"></label><label>Country<input id="country" required></label><label>Business address<input id="address"></label><label>Website<input id="website" type="url"></label><label>Registration number<input id="registration_number"></label><label>Contact name<input id="contact_name" required></label><label>Contact email<input id="contact_email" type="email" required></label><label>Contact phone<input id="contact_phone"></label><label>Company description<textarea id="company_description" rows="4"></textarea></label><button class="btn" type="submit">Submit for verification</button></form><p id="status" class="micro" role="status"></p></div><div class="job" style="margin-top:20px;padding:24px"><h2>Submit an agency vacancy</h2><p>Vacancies remain private until JobSeek approves them.</p><form id="jobForm" style="display:grid;gap:12px"><label>Job title<input id="title" required></label><label>Description<textarea id="description" rows="5" required></textarea></label><label>Country<input id="job_country" required></label><label>City<input id="job_city"></label><label>Job type<input id="job_type" placeholder="Full-time"></label><label>Category<input id="category" placeholder="Construction"></label><label>Salary minimum<input id="salary_min" type="number"></label><label>Salary maximum<input id="salary_max" type="number"></label><label>Currency<input id="salary_currency" placeholder="EUR"></label><label>Positions available<input id="positions_available" type="number" min="1" value="1"></label><label><input id="visa_sponsorship" type="checkbox"> Visa sponsorship available</label><label>Requirements (one per line)<textarea id="requirements" rows="4"></textarea></label><label>Benefits (one per line)<textarea id="benefits" rows="4"></textarea></label><label>Application deadline<input id="application_deadline" type="date"></label><button class="btn" type="submit">Submit vacancy for approval</button></form><p id="jobStatus" class="micro" role="status"></p></div><p><a href="index.html">← Back to JobSeek</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
let client,user,employer;const $=id=>document.getElementById(id);const val=id=>$(id).value.trim();const lines=id=>val(id).split(/\n|,/).map(x=>x.trim()).filter(Boolean);
async function init(){if(!JobSeekSupabase.configured){$('status').textContent='Supabase public key is not configured yet.';return}client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key);const r=await client.auth.getUser();if(!r.data.user){location.href='auth.html';return}user=r.data.user;const e=await client.from('employers').select('*').eq('user_id',user.id).maybeSingle();if(e.error){$('status').textContent=e.error.message;return}employer=e.data;if(employer){['company_name','legal_name','country','address','website','registration_number','contact_name','contact_email','contact_phone','company_description'].forEach(x=>$(x).value=employer[x]||'');$('status').textContent='Verification status: '+employer.verification_status}}
$('employerForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='Submitting…';const payload={user_id:user.id,company_name:val('company_name'),legal_name:val('legal_name'),country:val('country'),address:val('address'),website:val('website'),registration_number:val('registration_number'),contact_name:val('contact_name'),contact_email:val('contact_email'),contact_phone:val('contact_phone'),company_description:val('company_description'),verification_status:'pending'};const r=employer?await client.from('employers').update(payload).eq('id',employer.id):await client.from('employers').insert(payload).select().single();if(r.error){$('status').textContent=r.error.message;return}employer=r.data||employer;$('status').textContent='Submitted. JobSeek must review and approve your employer account before the Verified Employer badge is shown.'};
$('jobForm').onsubmit=async e=>{e.preventDefault();if(!employer){$('jobStatus').textContent='Submit your employer verification first.';return}if(employer.verification_status!=='verified'){$('jobStatus').textContent='Your employer account must be verified before submitting an agency vacancy.';return}const payload={employer_id:employer.id,title:val('title'),description:val('description'),country:val('job_country'),city:val('job_city'),job_type:val('job_type'),category:val('category'),salary_min:val('salary_min')?Number(val('salary_min')):null,salary_max:val('salary_max')?Number(val('salary_max')):null,salary_currency:val('salary_currency'),visa_sponsorship:$('visa_sponsorship').checked,positions_available:Number(val('positions_available')||1),requirements:lines('requirements'),benefits:lines('benefits'),application_deadline:val('application_deadline')||null,status:'submitted',verification_status:'pending'};const r=await client.from('agency_jobs').insert(payload);if(r.error){$('jobStatus').textContent=r.error.message;return}$('jobStatus').textContent='Vacancy submitted for JobSeek review. It is not public yet.'};init();</script></body></html>
