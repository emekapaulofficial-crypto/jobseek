<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSeek | Employer Applicants</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">J</span><b>Job<span>Seek</span></b></a><nav><a href="employer-portal.html">Employer Portal</a><a href="smart-cv.html">Smart CV Engine</a></nav></div></header><main class="section"><div class="container"><p class="eyebrow">SMART RECRUITMENT</p><h1>Applicants sorted by CV score</h1><p class="lead">JobSeek automatically stores the final CV score with each application. Highest score appears first. This is recruitment decision-support, not a guarantee of candidate suitability.</p><div id="status" class="job" style="padding:16px">Loading applicants…</div><div id="list"></div></div></main><script>
const client=supabase.createClient(JobSeekSupabase.url,JobSeekSupabase.key),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function init(){
 const u=await client.auth.getUser();if(!u.data.user){location.href='auth.html?role=employer';return}
 const role=await client.from('jobseek_accounts').select('role').eq('id',u.data.user.id).maybeSingle();
 if(role.error||role.data?.role!=='employer'){ $('status').textContent='Employer access required.';return}
 const r=await client.from('applications').select('id,final_score,score_level,score_feedback,status,submitted_at,cover_message,candidate_profiles(full_name,profession,target_job,years_experience,education,skills),agency_jobs!inner(id,title,employer_id)').order('final_score',{ascending:false,nullsFirst:false});
 if(r.error){$('status').textContent='Could not load applicants: '+r.error.message;return}
 const own=r.data.filter(x=>x.agency_jobs?.employer_id);
 $('status').textContent=own.length+' applicant(s) loaded. Sorted by final CV score.';
 $('list').innerHTML=own.length?own.map((a,i)=>{const p=a.candidate_profiles||{},s=a.final_score??0,l=s>=80?'STRONG':s>=50?'AVERAGE':'WEAK';return '<article class="job" style="padding:20px;margin:14px 0"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><h2 style="margin:0">'+esc(p.full_name||'Candidate')+'</h2><p>'+esc(p.profession||p.target_job||'')+' · '+esc(a.agency_jobs?.title||'')+'</p></div><strong style="font-size:30px">'+s+'</strong></div><p><b>Badge:</b> '+(s>=90?'Top Applicant':s>=80?'Strong Match':s>=50?'Review Candidate':'CV Gate Rejected')+' · <b>Level:</b> '+l+'</p><p><b>Experience:</b> '+esc(p.years_experience||0)+' years · <b>Skills:</b> '+esc((p.skills||[]).join(', ')||'—')+'</p><p><b>Application:</b> '+esc(a.status||'submitted')+'</p></article>'}).join(''):'No applicants found for this employer.';
}
init();
</script></body></html>
